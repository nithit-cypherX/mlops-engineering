# Lab 4 Task 2: tests -> push the tested digest -> staging smoke, main only.
# Requires a main-only lab4-staging environment and its separate OIDC trust.
# Adapted from the instructor's CI at 2e29faeb1fdaa6360947808e32b0e3c1444113f2.
name: Lab 4 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Let main finish deployment and IP cleanup; only superseded PR tests are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: lab/lab4

env:
  PYTHON: python

jobs:
  checks:
    name: Secret scan, lint, unit and data tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full Git history before installing dependencies
        run: make scan-secrets PYTHON=python3

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: lab/lab4/requirements.txt

      - name: Install locked dependencies
        run: make setup

      - name: Lint and portability audit
        run: make lint portability-audit

      # Drift/calibration/snapshot tests also need the pinned training reference.
      - name: Restore the pinned dataset
        run: make data-pull

      - name: Unit tests
        run: make test-unit

      - name: Data contract and leakage tests
        run: make test-data

      # A skipped cloud job must not make an untested fork look fully green.
      - name: Stop when protected Azure tests cannot run
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
           github.actor == 'dependabot[bot]')
        run: |
          echo "::error::Offline checks passed, but this PR cannot use Azure credentials. Full Lab 4 CI has not passed. An owner must review and rerun the changes from a trusted branch."
          exit 1

  registry-main:
    outputs:
      image: ${{ steps.push-image.outputs.image }}
    name: Model, image and integration tests, then push (main)
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No environment: Azure trust expects the main branch OIDC subject.
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_PROVIDER: azure
      CONTAINER_REGISTRY: ${{ vars.LAB4_CONTAINER_REGISTRY }}
      MLFLOW_TRACKING_URI: ${{ vars.LAB4_MLFLOW_TRACKING_URI }}
      MODEL_REGISTRY_NAME: ${{ vars.LAB4_MODEL_REGISTRY_NAME }}
      MODEL_VERSION: ${{ vars.LAB4_MODEL_VERSION }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.LAB4_AZURE_SUBSCRIPTION_ID }}
      AZURE_TOKEN_CREDENTIALS: AzureCliCredential
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: lab/lab4/requirements.txt

      - name: Install locked dependencies and restore data
        run: make setup data-pull

      - name: Log in with the model-reader identity (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.LAB4_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LAB4_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LAB4_AZURE_SUBSCRIPTION_ID }}

      - name: Registered model behaviour tests
        timeout-minutes: 5
        run: make test-model

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the serving image for the checked-out commit
        run: make serve-image IMAGE=itcs355-lab4 TAG="$GITHUB_SHA" PLATFORM=linux/amd64

      - name: Test the exact built image
        timeout-minutes: 5
        # The test requests a fresh short-lived token and passes it through stdin.
        run: make test-integration IMAGE=itcs355-lab4 TAG="$GITHUB_SHA"

      - name: Log in with the image-publisher identity (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        env:
          AZURE_LOGIN_PRE_CLEANUP: true
        with:
          client-id: ${{ secrets.LAB4_AZURE_PUSH_CLIENT_ID }}
          tenant-id: ${{ secrets.LAB4_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LAB4_AZURE_SUBSCRIPTION_ID }}

      - name: Push the tested image and print its repository digest
        id: push-image
        timeout-minutes: 10
        run: |
          make --no-print-directory --silent image-push IMAGE=itcs355-lab4 TAG="$GITHUB_SHA" | tee "$RUNNER_TEMP/lab4-push.log"
          image="$(tail -n 1 "$RUNNER_TEMP/lab4-push.log")"
          [[ "$image" == "$CONTAINER_REGISTRY"@sha256:* ]]
          digest="${image##*@sha256:}"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Clear the runner's registry login
        if: always() && env.CONTAINER_REGISTRY != ''
        run: docker logout "${CONTAINER_REGISTRY%%/*}"

  registry-pr:
    name: Model, image and integration tests (reviewed PR)
    needs: checks
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Required owner review + refs/pull/*/merge restriction are configured in GitHub.
    environment: lab4-ci-pr
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_PROVIDER: azure
      MLFLOW_TRACKING_URI: ${{ vars.LAB4_MLFLOW_TRACKING_URI }}
      MODEL_REGISTRY_NAME: ${{ vars.LAB4_MODEL_REGISTRY_NAME }}
      MODEL_VERSION: ${{ vars.LAB4_MODEL_VERSION }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.LAB4_AZURE_SUBSCRIPTION_ID }}
      AZURE_TOKEN_CREDENTIALS: AzureCliCredential
      AZURE_CORE_OUTPUT: none
    # Keep the test steps identical to registry-main; PRs never publish images.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: lab/lab4/requirements.txt

      - name: Install locked dependencies and restore data
        run: make setup data-pull

      - name: Log in with the model-reader identity (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.LAB4_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LAB4_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LAB4_AZURE_SUBSCRIPTION_ID }}

      - name: Registered model behaviour tests
        timeout-minutes: 5
        run: make test-model

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the serving image for the checked-out commit
        run: make serve-image IMAGE=itcs355-lab4 TAG="$GITHUB_SHA" PLATFORM=linux/amd64

      - name: Test the exact built image
        timeout-minutes: 5
        run: make test-integration IMAGE=itcs355-lab4 TAG="$GITHUB_SHA"

  deploy-staging:
    name: Deploy tested digest and smoke-test staging
    needs: registry-main
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.registry-main.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: lab4-staging
    concurrency:
      group: lab4-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_PROVIDER: azure
      PROJECT_ID: ${{ vars.LAB4_PROJECT_ID }}
      REGION: ${{ vars.LAB4_REGION }}
      CONTAINER_REGISTRY: ${{ vars.LAB4_CONTAINER_REGISTRY }}
      MLFLOW_TRACKING_URI: ${{ vars.LAB4_MLFLOW_TRACKING_URI }}
      MODEL_REGISTRY_NAME: ${{ vars.LAB4_MODEL_REGISTRY_NAME }}
      MODEL_VERSION: ${{ vars.LAB4_MODEL_VERSION }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.LAB4_AZURE_SUBSCRIPTION_ID }}
      AZURE_ML_WORKSPACE: ${{ vars.LAB4_AZURE_ML_WORKSPACE }}
      IDENTITY_REF: ${{ vars.LAB4_RUNTIME_PRINCIPAL_ID }}
      AZURE_MANAGED_IDENTITY_ID: ${{ vars.LAB4_RUNTIME_IDENTITY_ID }}
      AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.LAB4_CONTAINERAPPS_ENVIRONMENT }}
      ENDPOINT_NAME: ${{ vars.LAB4_STAGING_ENDPOINT }}
      SERVING_IMAGE: ${{ needs.registry-main.outputs.image }}
      SERVING_ALLOWED_IP: ${{ secrets.LAB4_SERVING_ALLOWED_IP }}
      SERVING_INSTANCE: 0.5cpu-1Gi
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: lab/lab4/requirements.txt

      - name: Install locked dependencies
        timeout-minutes: 5
        run: make setup

      - name: Validate deployment settings and discover runner IPv4
        timeout-minutes: 1
        run: |
          python -c 'from src.config import load_deployment; load_deployment()'
          runner_ip="$(curl --ipv4 --fail --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          RUNNER_IP="$runner_ip" python - <<'PY'
          import ipaddress
          import os

          address = ipaddress.ip_address(os.environ["RUNNER_IP"])
          if address.version != 4 or not address.is_global:
              raise ValueError("Runner must have a public IPv4 address")
          print(f"::add-mask::{address}")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"SERVING_RUNNER_IP={address}/32\n")
          PY

      - name: Log in with the staging-deployer identity (OIDC)
        id: azure-login
        timeout-minutes: 2
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.LAB4_AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.LAB4_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LAB4_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the tested digest with temporary runner access
        id: deploy
        timeout-minutes: 12
        run: make deploy

      - name: Smoke-test three fixed payloads
        timeout-minutes: 5
        run: make smoke

      # Best effort on cancellation; a lost/force-cancelled runner needs manual restore-access.
      - name: Restore client-only access and confirm it
        if: >-
          always() && steps.azure-login.outcome == 'success' &&
          (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure' ||
           steps.deploy.outcome == 'cancelled')
        timeout-minutes: 5
        run: make restore-access
